<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة عرض الألعاب والأكواد</title>
    <style>
        :root {
            --primary: #3498db;
            --dark: #2c3e50;
            --light: #ecf0f1;
            --danger: #e74c3c;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light);
            margin: 0;
            padding: 0;
            color: var(--dark);
        }
        .container {
            max-width: 800px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1, h2 {
            text-align: center;
            color: var(--dark);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"], input[type="password"], textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        textarea {
            height: 100px;
            resize: vertical;
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            margin-bottom: 10px;
        }
        button:hover {
            background-color: #2980b9;
        }
        .btn-secondary {
            background-color: #7f8c8d;
        }
        .btn-secondary:hover {
            background-color: #95a5a6;
        }
        .btn-danger {
            background-color: var(--danger);
        }
        /* Views */
        .view {
            display: none;
        }
        .view.active {
            display: block;
        }
        /* Dashboard buttons */
        .dash-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        /* Items Grid */
        #items-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        .item-card {
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 8px;
            background: #fafafa;
        }
        .item-card img {
            max-width: 100%;
            height: auto;
            border-radius: 5px;
            margin-bottom: 10px;
            max-height: 300px;
            object-fit: cover;
        }
        .item-badge {
            display: inline-block;
            background: var(--primary);
            color: white;
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 12px;
            margin-bottom: 10px;
        }
        .empty-message {
            text-align: center;
            color: #7f8c8d;
            font-size: 1.2em;
            padding: 40px 0;
        }
        .download-btn {
            display: inline-block;
            background: #27ae60;
            color: white;
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 5px;
            margin-top: 10px;
        }
        pre {
            background: #2d2d2d;
            color: #ccc;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            direction: ltr;
        }
    </style>
</head>
<body>

<div class="container">
    
    <!-- واجهة تسجيل الدخول -->
    <div id="view-login" class="view active">
        <h1>تسجيل دخول الإدارة</h1>
        <div class="form-group">
            <label>اسم المستخدم:</label>
            <input type="text" id="login-user" placeholder="أدخل اسم المستخدم">
        </div>
        <div class="form-group">
            <label>كلمة المرور:</label>
            <input type="password" id="login-pass" placeholder="أدخل كلمة المرور">
        </div>
        <button id="btn-login">تسجيل الدخول</button>
        <button class="btn-secondary" onclick="switchView('view-main')">ليس لدي حساب (الذهاب للقائمة الرئيسية)</button>
    </div>

    <!-- القائمة الرئيسية (للزوار) -->
    <div id="view-main" class="view">
        <h1>القائمة الرئيسية</h1>
        <button id="btn-goto-admin" class="btn-secondary" style="display:none;" onclick="switchView('view-admin')">العودة للوحة التحكم</button>
        <button class="btn-secondary" id="btn-goto-login" onclick="switchView('view-login')">تسجيل دخول كأدمن</button>
        
        <div id="items-container">
            <!-- سيتم تحميل المحتوى هنا -->
        </div>
    </div>

    <!-- لوحة تحكم الأدمن -->
    <div id="view-admin" class="view">
        <h1>لوحة تحكم المسؤول</h1>
        <div class="dash-buttons">
            <button onclick="switchView('view-add-game')">إضافة لعبة</button>
            <button onclick="switchView('view-add-code')">إضافة كود</button>
            <button onclick="switchView('view-add-script')">إضافة سكريبت</button>
        </div>
        <button class="btn-secondary" onclick="switchView('view-main')">عرض القائمة الرئيسية</button>
        <button class="btn-danger" onclick="logout()">تسجيل الخروج</button>
    </div>

    <!-- إضافة لعبة -->
    <div id="view-add-game" class="view">
        <h2>إضافة لعبة جديدة</h2>
        <div class="form-group">
            <label>اسم اللعبة:</label>
            <input type="text" id="game-title">
        </div>
        <div class="form-group">
            <label>وصف اللعبة:</label>
            <textarea id="game-desc"></textarea>
        </div>
        <div class="form-group">
            <label>صورة اللعبة:</label>
            <input type="file" id="game-image" accept="image/*">
        </div>
        <div class="form-group">
            <label>ملف اللعبة:</label>
            <input type="file" id="game-file">
        </div>
        <button id="btn-submit-game">رفع ونشر اللعبة</button>
        <button class="btn-secondary" onclick="switchView('view-admin')">رجوع</button>
    </div>

    <!-- إضافة كود -->
    <div id="view-add-code" class="view">
        <h2>إضافة كود جديد</h2>
        <div class="form-group">
            <label>اسم الكود:</label>
            <input type="text" id="code-title">
        </div>
        <div class="form-group">
            <label>وصف الكود:</label>
            <textarea id="code-desc"></textarea>
        </div>
        <div class="form-group">
            <label>محتوى الكود:</label>
            <textarea id="code-content" style="direction:ltr; text-align:left;"></textarea>
        </div>
        <button id="btn-submit-code">نشر الكود</button>
        <button class="btn-secondary" onclick="switchView('view-admin')">رجوع</button>
    </div>

    <!-- إضافة سكريبت -->
    <div id="view-add-script" class="view">
        <h2>إضافة سكريبت جديد</h2>
        <div class="form-group">
            <label>اسم السكريبت:</label>
            <input type="text" id="script-title">
        </div>
        <div class="form-group">
            <label>وصف السكريبت:</label>
            <textarea id="script-desc"></textarea>
        </div>
        <div class="form-group">
            <label>محتوى السكريبت:</label>
            <textarea id="script-content" style="direction:ltr; text-align:left;"></textarea>
        </div>
        <button id="btn-submit-script">نشر السكريبت</button>
        <button class="btn-secondary" onclick="switchView('view-admin')">رجوع</button>
    </div>

</div>

<!-- إعداد الفايربيس (Firebase) كـ Modules -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, orderBy, query } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBfOQgxoE5mOk5PZ1Q0ov15pOMJ1Dlnmvg",
      authDomain: "baraaofficial.firebaseapp.com",
      projectId: "baraaofficial",
      storageBucket: "baraaofficial.firebasestorage.app",
      messagingSenderId: "995653975021",
      appId: "1:995653975021:web:ffddcac178041e65e485e4",
      measurementId: "G-K2KWSW35MF"
    };

    // تهيئة الفايربيس
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    let isAdmin = false;

    // دالة التبديل بين الواجهات
    window.switchView = function(viewId) {
        document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
        document.getElementById(viewId).classList.add('active');

        if (viewId === 'view-main') {
            if (isAdmin) {
                document.getElementById('btn-goto-admin').style.display = 'block';
                document.getElementById('btn-goto-login').style.display = 'none';
            } else {
                document.getElementById('btn-goto-admin').style.display = 'none';
                document.getElementById('btn-goto-login').style.display = 'block';
            }
        }
    }

    // تسجيل الدخول المحلي
    document.getElementById('btn-login').addEventListener('click', () => {
        const user = document.getElementById('login-user').value;
        const pass = document.getElementById('login-pass').value;

        if (user === 'baraa' && pass === 'hacker88') {
            isAdmin = true;
            document.getElementById('login-user').value = '';
            document.getElementById('login-pass').value = '';
            switchView('view-admin');
        } else {
            alert('بيانات الدخول غير صحيحة!');
        }
    });

    window.logout = function() {
        isAdmin = false;
        switchView('view-login');
    }

    // إضافة كود
    document.getElementById('btn-submit-code').addEventListener('click', async () => {
        const title = document.getElementById('code-title').value;
        const desc = document.getElementById('code-desc').value;
        const content = document.getElementById('code-content').value;

        if(!title || !content) return alert("الرجاء إدخال الاسم والمحتوى");
        
        document.getElementById('btn-submit-code').innerText = "جاري النشر...";
        try {
            await addDoc(collection(db, "posts"), {
                type: "كود",
                title: title,
                description: desc,
                content: content,
                timestamp: Date.now()
            });
            alert("تم نشر الكود بنجاح!");
            document.getElementById('code-title').value = '';
            document.getElementById('code-desc').value = '';
            document.getElementById('code-content').value = '';
            switchView('view-admin');
        } catch(e) {
            console.error(e);
            alert("حدث خطأ أثناء النشر");
        }
        document.getElementById('btn-submit-code').innerText = "نشر الكود";
    });

    // إضافة سكريبت
    document.getElementById('btn-submit-script').addEventListener('click', async () => {
        const title = document.getElementById('script-title').value;
        const desc = document.getElementById('script-desc').value;
        const content = document.getElementById('script-content').value;

        if(!title || !content) return alert("الرجاء إدخال الاسم والمحتوى");

        document.getElementById('btn-submit-script').innerText = "جاري النشر...";
        try {
            await addDoc(collection(db, "posts"), {
                type: "سكريبت",
                title: title,
                description: desc,
                content: content,
                timestamp: Date.now()
            });
            alert("تم نشر السكريبت بنجاح!");
            document.getElementById('script-title').value = '';
            document.getElementById('script-desc').value = '';
            document.getElementById('script-content').value = '';
            switchView('view-admin');
        } catch(e) {
            console.error(e);
            alert("حدث خطأ أثناء النشر");
        }
        document.getElementById('btn-submit-script').innerText = "نشر السكريبت";
    });

    // إضافة لعبة (مع رفع الملفات)
    document.getElementById('btn-submit-game').addEventListener('click', async () => {
        const title = document.getElementById('game-title').value;
        const desc = document.getElementById('game-desc').value;
        const imageFile = document.getElementById('game-image').files[0];
        const gameFile = document.getElementById('game-file').files[0];

        if(!title || !imageFile || !gameFile) return alert("الرجاء إدخال الاسم والصورة وملف اللعبة");

        document.getElementById('btn-submit-game').innerText = "جاري الرفع... الرجاء الانتظار";
        document.getElementById('btn-submit-game').disabled = true;

        try {
            // رفع الصورة
            const imageRef = ref(storage, 'images/' + Date.now() + '_' + imageFile.name);
            await uploadBytes(imageRef, imageFile);
            const imageUrl = await getDownloadURL(imageRef);

            // رفع اللعبة
            const gameRef = ref(storage, 'games/' + Date.now() + '_' + gameFile.name);
            await uploadBytes(gameRef, gameFile);
            const gameUrl = await getDownloadURL(gameRef);

            // حفظ البيانات في Firestore
            await addDoc(collection(db, "posts"), {
                type: "لعبة",
                title: title,
                description: desc,
                imageUrl: imageUrl,
                fileUrl: gameUrl,
                timestamp: Date.now()
            });

            alert("تم رفع ونشر اللعبة بنجاح!");
            document.getElementById('game-title').value = '';
            document.getElementById('game-desc').value = '';
            document.getElementById('game-image').value = '';
            document.getElementById('game-file').value = '';
            switchView('view-admin');

        } catch(e) {
            console.error(e);
            alert("حدث خطأ أثناء الرفع! تأكد من إعدادات الـ Storage في الفايربيس");
        }

        document.getElementById('btn-submit-game').innerText = "رفع ونشر اللعبة";
        document.getElementById('btn-submit-game').disabled = false;
    });

    // استدعاء البيانات للقائمة الرئيسية
    const q = query(collection(db, "posts"), orderBy("timestamp", "desc"));
    onSnapshot(q, (snapshot) => {
        const container = document.getElementById('items-container');
        container.innerHTML = '';

        if (snapshot.empty) {
            container.innerHTML = '<div class="empty-message">لا يوجد أشياء حتى الآن</div>';
            return;
        }

        snapshot.forEach((doc) => {
            const data = doc.data();
            const card = document.createElement('div');
            card.className = 'item-card';
            
            let htmlContent = `<span class="item-badge">${data.type}</span>`;
            htmlContent += `<h3>${data.title}</h3>`;
            htmlContent += `<p>${data.description}</p>`;

            if (data.type === 'لعبة') {
                if (data.imageUrl) htmlContent += `<img src="${data.imageUrl}" alt="صورة اللعبة"> <br>`;
                if (data.fileUrl) htmlContent += `<a href="${data.fileUrl}" target="_blank" class="download-btn">تحميل اللعبة</a>`;
            } else if (data.type === 'كود' || data.type === 'سكريبت') {
                htmlContent += `<pre><code>${data.content.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</code></pre>`;
            }

            card.innerHTML = htmlContent;
            container.appendChild(card);
        });
    });

</script>
</body>
</html>
